version: '3.8'

networks:
  stella-shared:
    external: true
      name: stella-shared

services:
  web:
    build: 
      context: ./web
    command: gunicorn --bind 0.0.0.0:5000 run:app
    expose:
      - "5000"
    ports:
      - "8888:5000"
    volumes:
      - ./logs/:/src/logs
    networks:
      - stella-shared 
      
